name: ice-ice-water-production

x-server-build: &server-build
  context: .
  dockerfile: apps/server/Dockerfile

x-server-environment: &server-environment
  NODE_ENV: ${NODE_ENV:-production}
  GAME_SERVER_HOST: ${GAME_SERVER_HOST:-0.0.0.0}
  GAME_SERVER_PORT: ${GAME_SERVER_PORT:-2567}
  CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN to the public HTTPS origin}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private postgres service}
  GUEST_SESSION_SIGNING_SECRET: ${GUEST_SESSION_SIGNING_SECRET:?Set a random signing secret}
  GUEST_SESSION_TTL_SECONDS: ${GUEST_SESSION_TTL_SECONDS:-3600}
  ROOM_MAX_PLAYERS: ${ROOM_MAX_PLAYERS:-150}
  DEV_BOT_COUNT: '0'
  DEV_FORCE_ICE: 'false'
  COUNTDOWN_SECONDS: ${COUNTDOWN_SECONDS:-5}
  RECONNECT_SECONDS: ${RECONNECT_SECONDS:-25}

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: icewater
      POSTGRES_DB: icewater
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-production-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U icewater -d icewater']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  server:
    image: ice-ice-water-server:production
    build: *server-build
    environment:
      <<: *server-environment
    expose:
      - '2567'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2567/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - backend

  migrate:
    image: ice-ice-water-server:production
    build: *server-build
    command: ['node', 'apps/server/dist/persistence/migrate.js']
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private postgres service}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['ops']
    restart: 'no'
    networks:
      - backend

  frontend:
    image: ice-ice-water-frontend:production
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_GAME_SERVER_URL: ${VITE_GAME_SERVER_URL:?Set VITE_GAME_SERVER_URL to the public WSS origin}
        ALLOW_INSECURE_WS: ${ALLOW_INSECURE_WS:-false}
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:?Set TLS_DOMAIN to the certificate hostname}
      NGINX_ENVSUBST_FILTER: '^TLS_DOMAIN$'
    ports:
      - '${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
      - '${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443'
    volumes:
      - ${NGINX_CONFIG:-./deploy/nginx/http.conf}:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/proxy-common.conf:/etc/nginx/snippets/proxy-common.conf:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT_PATH:-./.deployment/acme-webroot}:/var/www/certbot:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend
      - ingress

volumes:
  postgres-production-data:

networks:
  backend:
    internal: true
  ingress:
    driver: bridge
