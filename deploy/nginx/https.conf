map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream game_server {
    server server:2567;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 8k;

    ssl_certificate /etc/letsencrypt/live/${TLS_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${TLS_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /api/guest-session {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://game_server;
    }

    location = /api/rooms {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://game_server;
    }

    location = /api/rooms/join {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://game_server;
    }

    location ~ ^/matchmake/reconnect/[A-Za-z0-9_-]+$ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://game_server;
    }

    location ~ ^/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/?$ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://game_server;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}