server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
